<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="290" viewBox="0 0 1100 290" role="img"><rect width="1100" height="290" rx="14" fill="#f1f4f2"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#548079"/></marker></defs><rect x="25" y="25" width="320" height="100" rx="8" fill="white" stroke="#b7cbc5"/><text x="43" y="60" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#173a36">01　导入源表</text><text x="43" y="94" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#596b66">CSV 与 Excel，保留原始文件</text><path d="M347 75h35" stroke="#548079" stroke-width="2" marker-end="url(#arrow)"/><rect x="390" y="25" width="320" height="100" rx="8" fill="white" stroke="#b7cbc5"/><text x="408" y="60" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#173a36">02　去重与校验</text><text x="408" y="94" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#596b66">完全重复合并，内容冲突转人工</text><path d="M712 75h35" stroke="#548079" stroke-width="2" marker-end="url(#arrow)"/><rect x="755" y="25" width="320" height="100" rx="8" fill="white" stroke="#b7cbc5"/><text x="773" y="60" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#173a36">03　汇总指标</text><text x="773" y="94" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#596b66">当日已付订单与成功退款</text><rect x="25" y="160" width="320" height="100" rx="8" fill="white" stroke="#b7cbc5"/><text x="43" y="195" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#173a36">04　库存检查</text><text x="43" y="229" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#596b66">按商品主数据阈值预警</text><path d="M347 210h35" stroke="#548079" stroke-width="2" marker-end="url(#arrow)"/><rect x="390" y="160" width="320" height="100" rx="8" fill="white" stroke="#b7cbc5"/><text x="408" y="195" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#173a36">05　生成日报</text><text x="408" y="229" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#596b66">Excel 汇总、销量、库存、异常</text><path d="M712 210h35" stroke="#548079" stroke-width="2" marker-end="url(#arrow)"/><rect x="755" y="160" width="320" height="100" rx="8" fill="white" stroke="#b7cbc5"/><text x="773" y="195" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#173a36">06　记录与复核</text><text x="773" y="229" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#596b66">日志、状态文件及自动化测试</text><path d="M1070 75h15v65H10v70h10" fill="none" stroke="#548079" stroke-width="2" marker-end="url(#arrow)"/></svg>