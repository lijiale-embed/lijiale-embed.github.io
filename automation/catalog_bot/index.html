<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>商品管理台 · 自动化练习</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#243b53;font:15px/1.7 'Microsoft YaHei',sans-serif}header{background:#173a46;color:white;padding:24px max(24px,calc((100% - 1150px)/2))}header small{color:#b9d4d6}h1{font-size:27px;margin:4px 0}main{max-width:1150px;padding:28px 20px;margin:auto}.layout{display:grid;grid-template-columns:320px 1fr;gap:24px}section{background:white;border:1px solid #dfe5e9;padding:24px;border-radius:10px}h2{font-size:19px;margin:0 0 20px}label{display:block;margin:12px 0}input{display:block;width:100%;padding:10px;border:1px solid #adbac4;border-radius:4px;font:inherit}button{background:#176b64;border:0;padding:12px 18px;color:#fff;border-radius:5px;font:inherit;cursor:pointer;width:100%}button:disabled{opacity:.6}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #e3e8eb}th{color:#526875;background:#f6f8f9}.scroll{overflow-x:auto}#message{min-height:55px;padding-top:12px}#message[data-state=error]{color:#a92e37}#message[data-state=success]{color:#176b64}.note{color:#627580;font-size:13px;margin-bottom:20px}@media(max-width:760px){.layout{grid-template-columns:1fr}section{padding:18px}}</style></head>
<body><header><small>个人模拟业务项目 / 本地练习环境</small><h1>商品管理台</h1><div>批量录入前校验，让重复操作可追踪。</div></header><main>
<p class="note">SKU 是唯一标识。相同 SKU 不会重复新增；错误数据须修正后重新提交。</p><div class="layout">
<section><h2>新增商品</h2><form id="product-form">
<label for="name">商品名称</label><input id="name" name="name" required maxlength="120">
<label for="sku">SKU</label><input id="sku" name="sku" required maxlength="64">
<label for="price">售价（元）</label><input id="price" name="price" type="number" min="0.01" step="0.01" required>
<label for="stock">库存</label><input id="stock" name="stock" type="number" min="0" step="1" required>
<p><button type="submit" id="submit">保存商品</button></p></form><div id="message" role="status" data-testid="message"></div></section>
<section><h2>商品列表 <span id="count">0</span></h2><div class="scroll"><table data-testid="catalog-table"><thead><tr><th>SKU</th><th>商品名称</th><th>售价（元）</th><th>库存</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</div></main><script>
const form=document.querySelector('form'),message=document.querySelector('#message'),button=document.querySelector('button');
async function refresh(){const response=await fetch('/api/products');if(!response.ok)throw Error('无法加载商品列表');const data=await response.json();const rows=document.querySelector('#rows');rows.replaceChildren();for(const p of data){const tr=document.createElement('tr');for(const v of [p.sku,p.name,Number(p.price).toFixed(2),p.stock]){const td=document.createElement('td');td.textContent=v;tr.append(td)}rows.append(tr)}document.querySelector('#count').textContent=data.length}
form.addEventListener('submit',async event=>{event.preventDefault();button.disabled=true;message.textContent='正在保存…';message.dataset.state='pending';try{const payload=Object.fromEntries(new FormData(form));const response=await fetch('/api/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await response.json();message.dataset.state=response.ok?'success':'error';message.textContent=response.ok?'保存成功':data.error;await refresh()}catch(error){message.dataset.state='error';message.textContent='连接失败：'+error.message}finally{button.disabled=false}});
refresh().catch(error=>{message.dataset.state='error';message.textContent=error.message});
</script></body></html>
